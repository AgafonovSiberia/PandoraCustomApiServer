[pytest]
# Pytest конфигурация для unit-тестов

# Минимальная версия pytest
minversion = 7.0

# Директории для поиска тестов
testpaths = .

# Паттерны для поиска тестовых файлов
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Маркеры для категоризации тестов
markers =
    asyncio: mark test as async test
    unit: mark test as unit test
    slow: mark test as slow running test
    integration: mark test as integration test

# Опции для asyncio
asyncio_mode = auto

# Опции вывода
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    
# Покрытие кода (если используется pytest-cov)
# --cov=apps/gateway/api/routes/device
# --cov=apps/gateway/services/device
# --cov-report=term-missing
# --cov-report=html

# Игнорировать предупреждения
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning